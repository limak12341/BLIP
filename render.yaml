services:
  - type: web
    name: bflip
    # ── UWAGA: Wybierz metodę deploymentu ──
    # Opcja 1 (Node buildpack — obecna): runtime: node, buildCommand, startCommand
    # Opcja 2 (Docker — odkomentuj poniżej): usuń runtime/buildCommand/startCommand, Render auto-wykryje Dockerfile
    runtime: node
    plan: starter  # ⚠️ Redis wymaga płatnego planu (Starter od $7/mies.)
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      # ── BOT ───────────────────────────────────────────────────
      # Ustaw ENABLE_BOT=true i wklej ROBLOX_COOKIE żeby bot działał
      - key: ENABLE_BOT
        value: true
      - key: ROBLOX_COOKIE
        value: wklej_cookie_konta_bota_tutaj
        sync: false
      - key: BOT_SECRET
        value: 92d79e9b8988a59c4d9a135f8c2d9e7b80e141fb26576a86a857a810fa6a71ce
        sync: false
      - key: SERVER_URL
        value: https://blip-79s3.onrender.com
        sync: false
      # ── REDIS (automatycznie podpięty) ────────────────────────
      - key: REDIS_URL
        fromService:
          type: redis
          name: redis-bflip
          property: connectionString

  # ── REDIS SERVICE ────────────────────────────────────────────
  - type: redis
    name: redis-bflip
    plan: starter  # Redis wymaga co najmniej planu Starter
    maxmemoryPolicy: allkeys-lru  # Automatyczne usuwanie starych kluczy
