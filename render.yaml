services:
  - type: web
    name: bflip
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      # ── BOT ───────────────────────────────────────────────────
      # Ustaw ENABLE_BOT=true i wklej ROBLOX_COOKIE żeby bot działał
      - key: ENABLE_BOT
        value: true
      - key: ROBLOX_COOKIE
        value: wklej_cookie_konta_bota_tutaj
        sync: false
      - key: BOT_SECRET
        value: 92d79e9b8988a59c4d9a135f8c2d9e7b80e141fb26576a86a857a810fa6a71ce
        sync: false
      - key: SERVER_URL
        value: https://blip-79s3.onrender.com  # Po deployu → wklej swój URL z Render
        sync: false
      # ── REDIS (do wyższej wydajności) ────────────────────────
      # Jeśli chcesz użyć Redis (płatny dodatek na Render), odkomentuj:
      # - key: REDIS_URL
      #   fromService:
      #     type: redis
      #     name: redis-bflip
      #     property: connectionString
